# Parametre kumesi (Revize 3). Her parametre: anlam, sinir, kaynak, capraz kontrol durumu, duyarli gosterge.
# Kod ile tutarlilik test_param.py icinde sinanir. Sayilar duz yazilir.
kural: "yayimlanmis sinir (>=2 kaynak ya da olcum) + net fiziksel anlam + dosya yamasiyla degistirilebilirlik"
parametreler:
  u:
    anlam: "gaz fazi CH4->CO hizi, tutusma bandi degiskeni; theta_g1 = u + Ta1*0.000113960114 (theta_g1 = ln k1(1350 K))"
    sinir: [12.111445, 12.708793]          # t_ign 4.4 s ve 3.0 s (band modeli)
    theta_g1_siniri: [10.049, 15.363]      # ln(23140), ln(4700000)  parametreler.yaml CH4ox_kref (WD 1981 via Wei 2021)
    kaynak: "WD 1981 (Wei vd. 2021 aktarimi) + donusum varsayimi (docstring)"
    capraz_kontrol: KISMI
    gosterge: [t_ign, TC8, TC9]
    dosya_yamasi: "constant/fluid/reactions CH4oxReaction A"
  Ta1:
    anlam: "gaz fazi CH4 oksidasyonu aktivasyon sicakligi [K]"
    sinir_faz_B: [15100, 24358]
    sinir_faz_A: [21000, 24358]            # band modeli yalniz Ta in [21000, 28012] izgarasinda kalibre
    kaynak: "WD 1981 (30 ve 48.4 kcal/mol)"
    capraz_kontrol: "KISMI (isaretli): tek kaynak ailesi; 13591/13592 K farkli yakit (yakit buhari), alinmadi"
    gosterge: [TC9 yukselme sekli]
    dosya_yamasi: "constant/fluid/reactions CH4oxReaction Ta"
  theta_p:
    anlam: "ln k_p1(650 K), piroliz adim 1 hizi"
    sinir: [-5.467406, -0.104735]          # Cui 2024 / S7 pamuk FDS k(650 K) (kodda hesaplanir)
    kaynak: "Cui & Liao 2024 Tablo 2; Zhao 2017; [S7] (NTRS 20210017787)"
    capraz_kontrol: "TAM (3 kaynak; Zhao ve Cui ayni grup)"
    gosterge: [TC7, ilk radyometre]
    dosya_yamasi: "constant/sibal/fvModels A1 = exp(theta_p + E1/(R*650))"
  E1:
    anlam: "piroliz adim 1 aktivasyon enerjisi [J/mol]"
    sinir: [125000, 188000]
    kaynak: "[S7] 125000; [S11] merserize pamuk 188000; Zhao 161440; Cui 171440"
    capraz_kontrol: TAM
    gosterge: [yuzey TC egimi]
    dosya_yamasi: "constant/sibal/fvModels E1"
  XL0:
    anlam: "piroliz gizli isisi [J/kg]"
    sinir: [300000, 538000]
    kaynak: "[S4] (via [S2]) ve [S10] (Milosavljevic-Oja-Suuberg 1996, YALNIZ OZET OKUNDU)"
    capraz_kontrol: "ZAYIF; [S10] tam metin okunamadi (osti.gov baglanti zaman asimi, 08.11) -> plan geregi XL0=300000 SABIT ve 'test edilemedi' listesinde (ml/param.py XL0_SERBEST=False)"
    durum: SABIT
    dosya_yamasi: "constant/sibal/fvModels XL0"
  eps:
    anlam: "ornek yuzey yayma katsayisi (0/fluid/G fluid_to_sibal)"
    sinir: [0.8, 0.9]
    kaynak: "[S2], [S8] (0.9 char)"
    capraz_kontrol: TAM
    gosterge: [radyometre, yuzey TC]
    dosya_yamasi: "0/fluid/G fluid_to_sibal emissivity"
A1_kesiti: [10000000000, 253000000000]     # literatur A araligi (S7; Cui 2024)
cikarilan:
  theta_g2: "R2 sabit (A2=50000000000000, Ta2=20100); 'R2 etkisi test edilemedi' listesinde"
sabit: [Ta2, A2, E2, n1, n2, cpInert, cpComb, alan_yogunlugu, tel_gucu_183_W, maxDeltaT_20_us]
